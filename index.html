<style>
:root{--bg:#eef2f6;--ink:#14213d;--muted:#52607a;--card:#fff;--accent:#2f5bea;--line:#d5dce8}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
body{font-family:Sora,system-ui,sans-serif;background:var(--bg);color:var(--ink);line-height:1.7}
a{color:inherit}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.wrap{max-width:1100px;margin:0 auto;padding:0 20px}
section{padding:80px 0}
h2{font-size:2rem;margin-bottom:28px}

header{position:sticky;top:0;background:var(--bg);border-bottom:1px solid var(--line);z-index:10}
.bar{display:flex;justify-content:space-between;align-items:center;height:64px}
.logo{font-weight:800;text-decoration:none}
nav ul{display:flex;gap:28px;list-style:none}
nav a{text-decoration:none;color:var(--muted)}
nav a:hover{color:var(--accent)}
.burger{display:none;background:none;border:1px solid var(--line);border-radius:6px;padding:6px 12px;font:inherit;cursor:pointer}

.hero{padding:110px 0 90px}
.hero h1{font-size:clamp(2.4rem,7vw,4.6rem);line-height:1.1;font-weight:800;max-width:14ch}
.hero p{max-width:52ch;color:var(--muted);margin:22px 0 32px;font-size:1.1rem}
.btn{display:inline-block;background:var(--accent);color:#fff;border:0;padding:13px 26px;border-radius:8px;font:inherit;font-weight:600;text-decoration:none;cursor:pointer}
.btn.alt{background:transparent;color:var(--ink);border:2px solid var(--ink);margin-left:12px}

.about{display:grid;grid-template-columns:1fr 2fr;gap:40px;align-items:center}
.avatar{aspect-ratio:1;background:var(--ink);color:#fff;border-radius:50%;display:grid;place-items:center;font-size:4rem;font-weight:800;max-width:260px}
.about p{color:var(--muted);margin-bottom:14px}

.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:24px}
.card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:24px}
.card h3{margin-bottom:10px}
.card p{color:var(--muted);font-size:.95rem;white-space:pre-line}
.mail{margin-bottom:8px;color:var(--muted)}
.mail a{color:var(--accent);font-weight:600;word-break:break-all}
.tags{display:flex;flex-wrap:wrap;gap:8px;margin-top:14px}
.tags span{background:var(--bg);border-radius:20px;padding:3px 12px;font-size:.85rem}
.card a{color:var(--accent);font-weight:600;display:inline-block;margin-top:14px}

form{max-width:560px}
label{display:block;font-weight:600;margin:18px 0 6px}
input,textarea{width:100%;padding:12px;border:1.5px solid var(--line);border-radius:8px;font:inherit;background:#fff}
input.bad,textarea.bad{border-color:#c62828}
.err{color:#c62828;font-size:.85rem;margin-top:4px}
.ok{background:#e3f4e8;border:1px solid #9fd1ae;padding:14px;border-radius:8px;margin-bottom:16px}
form .btn{margin-top:22px}
footer{border-top:1px solid var(--line);padding:26px 0;text-align:center;color:var(--muted);font-size:.9rem}

@media (max-width:900px){
  .grid{grid-template-columns:repeat(2,1fr)}
  .about{grid-template-columns:1fr}
}

@media (max-width:600px){
  section{padding:56px 0}
  .grid{grid-template-columns:1fr}
  .burger{display:block}
  nav{position:absolute;top:64px;left:0;right:0;background:var(--bg);border-bottom:1px solid var(--line);display:none}
  nav.open{display:block}
  nav ul{flex-direction:column;gap:0;padding:8px 20px}
  nav li a{display:block;padding:12px 0}
  .btn.alt{margin:12px 0 0}
}
</style>
</head>
